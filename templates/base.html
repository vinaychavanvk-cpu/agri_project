<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Agriculture Management System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<aside>
  <a class="brand" href="{{ url_for('dashboard') }}">Smart Agriculture<small>Management System</small></a>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('recommend') }}" class="ai">Crop advisor</a>
    <hr>
    {% for k, v in tables.items() %}<a href="{{ url_for('list_rows', t=k) }}">{{ v[0] }}</a>{% endfor %}
  </nav>
</aside>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
</body></html>
